name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build, Typecheck and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests (Shared & Backend)
        run: pnpm test

      - name: Build Backend
        run: pnpm build:backend

      - name: Build Customer App
        env:
          NEXT_PUBLIC_API_URL: https://api.printhub.example.com
        run: pnpm build:customer

      - name: Build Business Static Web App
        env:
          NEXT_PUBLIC_API_URL: https://api.printhub.example.com
        run: pnpm build:business
